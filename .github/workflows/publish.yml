name: Publish

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/common
      - run: npm run build -w packages/cli

      - run: npm run build -w packages/ui -- --base-href /muggins_calculator/

      - name: Download solution files from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download solutions-latest --pattern '*.mugbin' --dir solutions/ || echo "No solutions release found — skipping."

      - name: Copy solutions into build output
        run: |
          if ls solutions/solutions-*d.mugbin 1>/dev/null 2>&1; then
            cp solutions/solutions-*d.mugbin packages/ui/dist/muggins_calculator/browser/
            echo "Copied solution files into build output."
          else
            echo "No solution files found — deploying without precomputed solutions."
          fi

      - run: npm test

      - name: Install Playwright browsers
        working-directory: packages/ui
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: packages/ui
        run: npx playwright test

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: packages/ui/playwright/tests/**/*-snapshots/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/ui/test-results/

      - name: Coveralls - UI
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: packages/ui/coverage/muggins_calculator/lcov.info
          flag-name: ui
          parallel: true

      - name: Coveralls - Common
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: packages/common/coverage/lcov.info
          flag-name: common
          parallel: true

      - name: Coveralls - CLI
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: packages/cli/coverage/lcov.info
          flag-name: cli
          parallel: true

      - name: Coveralls - Finish
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist/muggins_calculator/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
