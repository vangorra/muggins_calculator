<div class="facesWrapper">
  <mat-button-toggle-group [formControl]="selectedFace">
    @for (face of getFaceOptions(); track face; let faceIndex = $index) {
      <mat-button-toggle
        [className]="'face' + faceIndex"
        [value]="face"
        >
        {{ face }}
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>
