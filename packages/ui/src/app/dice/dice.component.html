@for (die of dice; track die.index; let dieIndex = $index;) {
  <p>
    <app-die
      [attr.data-test-id]="'app-dice_app-die_' + dieIndex"
      [className]="'die' + dieIndex"
      [label]="'Die ' + (dieIndex + 1)"
      [die]="die"
      (faceChanged)="onDieChanged(dieIndex, $event)"
    ></app-die>
  </p>
}
